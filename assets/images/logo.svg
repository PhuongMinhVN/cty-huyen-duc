<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 100" width="100%" height="100%">
  <defs>
    <!-- Gradients for Luxury Industrial Aesthetic -->
    <linearGradient id="hdBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E4A96" />
      <stop offset="50%" stop-color="#0066CC" />
      <stop offset="100%" stop-color="#00B4D8" />
    </linearGradient>
    <linearGradient id="hdGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="hdCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#90E0EF" />
    </linearGradient>
    <filter id="hdGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- LOGO EMBLEM / ICON (Left side) -->
  <g transform="translate(10, 8)" filter="url(#softShadow)">
    <!-- Outer Shield / Hexagonal Industrial Frame -->
    <polygon points="42,0 78,21 78,63 42,84 6,63 6,21" fill="url(#hdBlueGrad)" opacity="0.1" />
    <polygon points="42,3 75,22 75,61 42,80 9,61 9,22" fill="none" stroke="url(#hdBlueGrad)" stroke-width="2.5" stroke-linejoin="round" />
    
    <!-- Gold Mechanical Gear / Precision Arc -->
    <path d="M 42 12 A 28 28 0 0 1 68 34" fill="none" stroke="url(#hdGoldGrad)" stroke-width="4" stroke-linecap="round" stroke-dasharray="3 3" />
    <path d="M 16 50 A 28 28 0 0 1 42 70" fill="none" stroke="url(#hdGoldGrad)" stroke-width="4" stroke-linecap="round" stroke-dasharray="3 3" />
    
    <!-- Stylized Monogram "H" & "D" with Oxygen Drop / Flame Core -->
    <!-- Left Pillar of H -->
    <path d="M 23,24 L 31,24 L 31,60 L 23,60 Z" fill="url(#hdBlueGrad)" />
    <!-- Crossbar of H with Molecule Link -->
    <path d="M 31,38 L 47,38 L 47,46 L 31,46 Z" fill="url(#hdBlueGrad)" />
    
    <!-- Right Pillar / D Curve representing Pure Gas Droplet & Chemistry Flow -->
    <path d="M 43,24 L 54,24 C 67,24 72,34 72,42 C 72,50 67,60 54,60 L 43,60 Z M 51,32 L 51,52 C 57,52 63,48 63,42 C 63,36 57,32 51,32 Z" fill="url(#hdBlueGrad)" />
    
    <!-- Central Oxygen Crystal Spark / Molecule Node -->
    <circle cx="42" cy="42" r="5" fill="url(#hdGoldGrad)" filter="url(#hdGlow)" />
    <circle cx="42" cy="42" r="2.5" fill="#FFFFFF" />

    <!-- Pure Oxygen Molecule satellites -->
    <circle cx="27" cy="20" r="3" fill="#00B4D8" />
    <circle cx="58" cy="64" r="3" fill="#F59E0B" />
  </g>

  <!-- TYPOGRAPHY / COMPANY NAME -->
  <!-- Brand Main Title: HUYỀN ĐỨC -->
  <text x="95" y="58" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="bold" letter-spacing="2" fill="#0f172a">
    HUYỀN ĐỨC
  </text>
</svg>
